name: Feature request
description: Suggest something the app should do that it does not do today.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The most useful thing you can write here is the **problem**, not the
        feature. A clearly described problem often has a cheaper solution than
        the one that comes to mind first.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: >
        What are you trying to do today, and what happens when you try? If
        there is a workaround you currently use, describe it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: >
        Including "do nothing". Knowing what you rejected and why is what makes
        a proposal reviewable.

  - type: dropdown
    id: platform
    attributes:
      label: Which platform is this for
      description: >
        Android is the primary target. A desktop-only request is still welcome,
        but will be weighed against that — see
        [ADR 0010](https://github.com/ajay99511/chronos_planner/blob/master/docs/decisions/0010-android-first-os-level-alarms.md).
      multiple: true
      options:
        - Android
        - Windows
        - Linux
        - macOS
        - iOS
        - Web
        - All of them
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: Tick any that apply. None of these disqualify a request.
      options:
        - label: This would need a new dependency
        - label: This would need a new OS permission
        - label: This would change how data is stored (a schema migration)
        - label: This would need network access
          # The app is offline-first by design; this is a deliberate boundary
          # rather than a missing feature, so it is worth flagging up front.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: >
            I checked [docs/decisions/](https://github.com/ajay99511/chronos_planner/tree/master/docs/decisions) — this is
            not something the project has already decided against
          required: false
