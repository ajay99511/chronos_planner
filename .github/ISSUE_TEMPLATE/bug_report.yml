name: Bug report
description: Something behaves differently from how it is documented or intended.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Use
        [private reporting](https://github.com/ajay99511/chronos_planner/security/advisories/new) instead — see
        [SECURITY.md](https://github.com/ajay99511/chronos_planner/blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, not what you think caused it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >
        Numbered, from a fresh launch. If it only happens sometimes, say how
        often and what seems to change it.
      placeholder: |
        1. Open the Alarms tab
        2. Create an alarm for two minutes from now
        3. Close the app from the recents switcher
        4. Wait
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Android is the primary target; desktop support is secondary.
      options:
        - Android
        - Windows
        - Linux
        - macOS
        - iOS
        - Web
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS version
      description: >
        For Android, the API level matters: alarm, notification and
        exact-alarm behaviour all differ across 31, 32, 33 and 34+.
      placeholder: "Pixel 6a, Android 14 (API 34)"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version or commit
      description: From the pubspec version, or the commit SHA you built.
      placeholder: "1.0.0+1, or 74ada3f"
    validations:
      required: true

  - type: textarea
    id: alarm-context
    attributes:
      label: If this is about an alarm or a timer
      description: >
        These depend on things outside the app, and the answers usually decide
        the bug. Leave blank if it is not alarm-related.
      value: |
        - Notification permission granted: yes / no / not sure
        - Battery optimisation exempted for the app: yes / no / not sure
        - Was the app open, backgrounded, or killed:
        - Did the device reboot between setting the alarm and it being due:
        - Custom sound file selected: yes / no

  - type: textarea
    id: logs
    attributes:
      label: Logs, stack trace or screenshots
      description: >
        `flutter logs`, or `adb logcat` filtered to the app. Paste as text
        rather than a screenshot where you can, so it is searchable.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: >
            I checked [docs/decisions/](https://github.com/ajay99511/chronos_planner/tree/master/docs/decisions) — this is
            not a limitation the project has already recorded on purpose
          required: false
