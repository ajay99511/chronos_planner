name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this project is developed against. An
          # unpinned "stable" moves under the build: a framework upgrade
          # already broke local compilation once by leaving package_config
          # recording an older language version.
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Warnings and infos fail the build. The project's analysis_options
        # enables a stricter rule set than the flutter_lints default, and the
        # tree is clean today -- keep it that way.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: Check generated code is current
        # Drift generates the schema accessors from tables.dart. A stale
        # .g.dart is invisible until runtime, and the mismatch surfaces as a
        # missing column rather than a compile error.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Fail if regeneration changed anything
        run: |
          if ! git diff --quiet -- '*.g.dart'; then
            echo "Generated code is out of date. Run:"
            echo "  dart run build_runner build --delete-conflicting-outputs"
            git diff --stat -- '*.g.dart'
            exit 1
          fi
