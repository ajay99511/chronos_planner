name: chronosky
description: "A futuristic time management application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  shared_preferences: ^2.5.6
  intl: ^0.20.2
  google_fonts: ^8.0.1
  uuid: ^4.6.0
  drift: ^2.35.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.0
  window_manager: ^0.5.2
  file_picker: ^13.3.1
  just_audio: ^0.10.6
  wakelock_plus: ^1.8.2

  # Pinned to the versions pubspec.lock already resolves. `any` let these
  # cross minor versions unreviewed -- meta moved 1.17 -> 1.19 during a routine
  # `pub get` -- and sqlite3 is the native engine behind all persistence.
  meta: ^1.19.0
  sqlite3: ^3.5.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon1.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
